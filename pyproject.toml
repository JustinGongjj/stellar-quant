[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stellarq"
version = "0.1.0"
description = "星衡量化：A 股量化研究 + 产业分析框架（含大量被证伪的假设记录）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stellar Quant" }]
keywords = ["quant", "a-share", "factor-model", "industry-chain", "backtest"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
web = []

[project.urls]
Homepage = "https://github.com/JustinGongjj/stellar-quant"
Issues = "https://github.com/JustinGongjj/stellar-quant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
