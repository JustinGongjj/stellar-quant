<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>势 · 数 ｜ 趋势推演工作台</title>
<style>
:root{
  --bg:#F5F3ED; --paper:#FFFFFF; --paper2:#FBF9F4; --paper3:#F0EDE4;
  --ink:#232823; --ink2:#59615A; --ink3:#8B928B; --line:#E4E0D6; --line2:#D6D1C4;
  --red:#AE3E2C; --red-l:#F6E8E3; --teal:#2C6C67; --teal-l:#E4F0ED;
  --gold:#A8802B; --gold-l:#F6EEDC; --blue:#3C5A80; --blue-l:#E7EDF5;
  --purple:#6A5680; --purple-l:#EEE9F3; --green:#4A7650; --green-l:#E8F1E7;
  --shadow:0 1px 2px rgba(40,38,30,.04),0 6px 22px rgba(40,38,30,.035);
  --serif:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--teal);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#D8D3C7;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;height:100vh;overflow:hidden}
/* ---------- sidebar ---------- */
.sidebar{width:238px;flex:0 0 238px;background:var(--paper2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:22px 20px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}
.seal{width:38px;height:38px;flex:0 0 38px;background:var(--red);border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-size:23px;box-shadow:0 2px 6px rgba(174,62,44,.22)}
.brand-t{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:2px;line-height:1.25}
.brand-s{font-size:10px;color:var(--ink3);letter-spacing:1.4px;margin-top:2px}
.motto{padding:16px 20px 14px;font-family:var(--serif);font-size:12px;color:var(--ink2);letter-spacing:1px;border-bottom:1px solid var(--line);line-height:1.9}
.motto b{color:var(--red);font-weight:600}
.nav{padding:12px 10px;flex:1}
.nav-lbl{font-size:10px;color:var(--ink3);letter-spacing:1.6px;padding:6px 12px 9px}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;color:var(--ink2);text-align:left;transition:.16s;margin-bottom:2px;font-size:12.5px}
.nav-item:hover{background:var(--paper3);color:var(--ink)}
.nav-item.on{background:var(--ink);color:#fff;box-shadow:0 3px 10px rgba(35,40,35,.14)}
.nav-num{font-family:Georgia,serif;font-size:10.5px;opacity:.55;width:17px;flex:0 0 17px}
.nav-item.on .nav-num{opacity:.8}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--red);margin-left:auto;opacity:0}
.nav-item.on .nav-dot{opacity:1;background:#E8B7A8}
.side-foot{padding:14px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink3);line-height:1.9}
.side-foot .row{display:flex;justify-content:space-between;align-items:center}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px}

/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:62px;flex:0 0 62px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;gap:18px;z-index:5}
.crumb{font-family:var(--serif);font-size:15px;font-weight:600;white-space:nowrap}
.crumb small{font-family:var(--sans);font-weight:400;font-size:11px;color:var(--ink3);margin-left:10px;letter-spacing:.5px}
.top-sp{flex:1}
.seg{display:flex;background:var(--paper3);border:1px solid var(--line);border-radius:7px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border-radius:5px;font-size:11.5px;color:var(--ink2);white-space:nowrap;transition:.15s}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
.tbtn{border:1px solid var(--line);background:var(--paper);padding:6px 11px;border-radius:6px;font-size:11.5px;color:var(--ink2);white-space:nowrap;transition:.15s}
.tbtn:hover{border-color:var(--line2);background:var(--paper2);color:var(--ink)}
.tbtn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbtn.pri:hover{background:#3A413A}
.snapshot{font-size:10.5px;color:var(--ink3);white-space:nowrap}
.scale-ctx{font-size:10.5px;color:var(--ink2);white-space:nowrap;padding:5px 11px;background:var(--paper2);border-left:2px solid var(--sc,#888);border-radius:0 5px 5px 0;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.scale-ctx b{font-weight:600}
.scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.wrap{max-width:1320px;margin:0 auto;padding:24px 28px 70px}
.notice{background:var(--gold-l);border:1px solid #E8D9B4;color:#7A5D1E;border-radius:8px;padding:8px 14px;font-size:11.5px;margin-bottom:20px;display:flex;gap:9px;align-items:center}
.notice b{font-weight:600}
.view{display:none;animation:fade .3s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- common ---------- */
.hero{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px 32px;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:20px}
.hero:before{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border:1px solid #EFEAE0;border-radius:50%;box-shadow:0 0 0 34px rgba(239,234,224,.35),0 0 0 68px rgba(239,234,224,.2)}
.hero-tag{font-size:10.5px;letter-spacing:2.4px;color:var(--red);margin-bottom:10px}
.hero h1{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:2px;line-height:1.4;margin-bottom:10px}
.hero p{color:var(--ink2);font-size:13px;max-width:760px;line-height:2}
.hero .quote{margin-top:16px;padding-left:14px;border-left:2px solid var(--red);font-family:var(--serif);font-size:13px;color:var(--ink2);letter-spacing:1px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card.pad0{padding:0;overflow:hidden}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:26px 0 13px}
.sec-h:first-child{margin-top:0}
.sec-h h2{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:1px}
.sec-h .en{font-size:10px;color:var(--ink3);letter-spacing:1.6px;text-transform:uppercase}
.sec-h .line{flex:1;height:1px;background:var(--line)}
.sec-h .hint{font-size:11px;color:var(--ink3)}
.card h3{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.6px;margin-bottom:8px}
.card h4{font-size:12.5px;font-weight:600;margin:12px 0 5px}
.muted{color:var(--ink2)}
.small{font-size:11.5px}
.tiny{font-size:10.5px;color:var(--ink3)}
.lead{font-size:12.5px;color:var(--ink2);line-height:1.95}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--paper3);color:var(--ink2);white-space:nowrap;border:1px solid transparent}
.tag.red{background:var(--red-l);color:var(--red)} .tag.teal{background:var(--teal-l);color:var(--teal)}
.tag.gold{background:var(--gold-l);color:var(--gold)} .tag.blue{background:var(--blue-l);color:var(--blue)}
.tag.purple{background:var(--purple-l);color:var(--purple)} .tag.green{background:var(--green-l);color:var(--green)}
.tag.line{background:transparent;border-color:var(--line2)}
.divider{height:1px;background:var(--line);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--ink2)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.num{font-family:Georgia,serif;font-variant-numeric:tabular-nums}
ul.dot{padding-left:17px;color:var(--ink2);font-size:12px;line-height:1.95}
ul.dot li{margin-bottom:3px}
ul.dot li::marker{color:var(--red)}
.hl{color:var(--red);font-weight:600}
.note-box{background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:11.5px;color:var(--ink2);line-height:1.9}
.note-box b{color:var(--ink)}
.btn{border:1px solid var(--line2);background:var(--paper);padding:6px 12px;border-radius:6px;font-size:11.5px;color:var(--ink2);transition:.15s}
.btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{padding:3px 9px;font-size:10.5px}
.metric{font-family:Georgia,serif;font-size:26px;line-height:1.2;color:var(--ink)}
.metric-l{font-size:10.5px;color:var(--ink3);letter-spacing:.8px;margin-top:4px}
.bar{height:6px;background:var(--paper3);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--teal);transition:width .4s ease}
.scroll-x{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:11.5px}
table.t th{text-align:left;font-weight:600;color:var(--ink3);font-size:10.5px;letter-spacing:.8px;padding:9px 10px;background:var(--paper2);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top;line-height:1.75}
table.t tr:last-child td{border-bottom:none}
table.t td:first-child{color:var(--ink);font-weight:600}
table.t tbody tr:hover{background:var(--paper2)}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--paper3);border-radius:4px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--paper);border:2px solid var(--red);box-shadow:0 1px 3px rgba(0,0,0,.15);cursor:grab}
input[type=text],input[type=number],textarea,select{border:1px solid var(--line2);background:var(--paper);border-radius:6px;padding:7px 9px;outline:none;width:100%;font-size:12px}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
textarea{resize:vertical;line-height:1.7}
label.ck{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:11.5px;color:var(--ink2)}
input[type=checkbox]{accent-color:var(--red);width:14px;height:14px;cursor:pointer}
.empty{color:var(--ink3);font-size:11.5px;padding:14px 0}

/* ---------- overview ---------- */
.chain{display:flex;flex-direction:column;gap:0}
.chain-row{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-bottom:none;background:var(--paper);overflow:hidden}
.chain-row:first-child{border-radius:10px 10px 0 0}
.chain-row:last-child{border-bottom:1px solid var(--line);border-radius:0 0 10px 10px}
.chain-lv{width:74px;flex:0 0 74px;background:var(--paper2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.chain-lv b{font-family:var(--serif);font-size:16px;color:var(--red)}
.chain-lv span{font-size:9.5px;color:var(--ink3);letter-spacing:1px}
.chain-body{padding:11px 16px;flex:1;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.chain-name{font-family:var(--serif);font-size:14px;font-weight:600;width:112px;flex:0 0 112px}
.chain-txt{font-size:11.5px;color:var(--ink2);flex:1;min-width:220px;line-height:1.8}
.chain-links{display:flex;gap:6px;flex-wrap:wrap}
.chain-arrow{text-align:center;color:var(--ink3);font-size:11px;line-height:1;padding:3px 0}
.axis-mini{display:flex;align-items:center;gap:12px}
.spec{position:relative;height:34px;border-radius:6px;background:linear-gradient(90deg,#2C6C67 0%,#6E9A86 30%,#D8B45C 62%,#C4644E 82%,#AE3E2C 100%);display:flex;overflow:hidden}
.spec span{flex:1;text-align:center;color:#fff;font-size:10px;line-height:34px;letter-spacing:1px;text-shadow:0 1px 2px rgba(0,0,0,.18)}

/* ---------- clock ---------- */
.clock-wrap{display:grid;grid-template-columns:390px 1fr;gap:20px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quad-c{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--paper2)}
.quad-c.on{border-color:var(--red);background:var(--red-l)}
.quad-c .q-t{font-family:var(--serif);font-size:14px;font-weight:600;margin-bottom:3px}
.quad-c .q-s{font-size:10.5px;color:var(--ink3);margin-bottom:8px}
.quad-c .q-b{font-size:11.5px;color:var(--ink2);line-height:1.85}
.cyc-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.cyc-row:last-child{border:none}
.cyc-row .cn{width:96px;flex:0 0 96px;font-size:11.5px;font-weight:600}
.cyc-row .cy{width:58px;flex:0 0 58px;font-size:10.5px;color:var(--ink3)}
.cyc-track{flex:1;height:8px;background:var(--paper3);border-radius:5px;position:relative;overflow:hidden}
.cyc-track i{position:absolute;top:0;height:100%;border-radius:5px;opacity:.75}
.cyc-track u{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink)}
.cyc-row .cd{font-size:10.5px;color:var(--ink2);width:140px;flex:0 0 140px;text-align:right}

/* ---------- factors ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.fchip{border:1px solid var(--line2);background:var(--paper);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--ink2)}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.f-item{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.f-top{display:flex;align-items:flex-start;gap:10px}
.f-title{font-family:var(--serif);font-size:14px;font-weight:600;flex:1}
.f-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.f-desc{font-size:11.5px;color:var(--ink2);line-height:1.85;margin:9px 0}
.f-ctl{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px;padding-top:11px;border-top:1px dashed var(--line)}
.f-ctl label{font-size:10.5px;color:var(--ink3);display:flex;justify-content:space-between;margin-bottom:5px}
.f-ctl label b{color:var(--red);font-family:Georgia,serif;font-size:11px}
.f-sig{margin-top:9px;font-size:10.5px;color:var(--ink3);line-height:1.8}
.f-sig b{color:var(--ink2);font-weight:600}
.f-off{opacity:.45}
.add-form{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px;align-items:center}

/* ---------- scenarios ---------- */
.sc-grid{display:grid;grid-template-columns:440px 1fr;gap:20px}
.sc-list{display:flex;flex-direction:column;gap:9px}
.sc-card{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--paper);cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.sc-card:hover{border-color:var(--line2)}
.sc-card.on{border-color:var(--red);box-shadow:0 3px 14px rgba(174,62,44,.09)}
.sc-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.sc-h{display:flex;align-items:center;gap:8px}
.sc-h b{font-family:var(--serif);font-size:14px}
.sc-p{margin-left:auto;font-family:Georgia,serif;font-size:19px;color:var(--c);font-weight:600}
.sc-sub{font-size:10.5px;color:var(--ink3);margin:3px 0 8px}
.sc-card .bar{margin-bottom:7px}
.heat{border-collapse:separate;border-spacing:2px;font-size:10px;width:100%}
.heat th{font-weight:500;color:var(--ink3);font-size:10px;padding:3px 5px;text-align:center;white-space:nowrap}
.heat td.fname{text-align:left;color:var(--ink2);font-size:10.5px;padding-right:8px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat td.cell{text-align:center;border-radius:4px;color:#fff;font-family:Georgia,serif;width:66px;height:25px}
.chainline{display:flex;align-items:flex-start;gap:0;flex-wrap:wrap;margin:12px 0}
.cl-node{border:1px solid var(--line);background:var(--paper2);border-radius:7px;padding:7px 10px;font-size:11px;color:var(--ink2);max-width:170px;line-height:1.6}
.cl-arw{padding:0 7px;color:var(--red);align-self:center;font-size:12px}

/* ---------- industry ---------- */
.tabs2{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs2 button{padding:8px 14px;font-size:12px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button.on{color:var(--red);border-color:var(--red);font-weight:600}
.icols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.icol{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.icol-h{font-family:var(--serif);font-size:13px;font-weight:600;padding-bottom:9px;margin-bottom:9px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.icol-h span{font-size:10px;color:var(--ink3);font-family:var(--sans)}
.node{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:9px 10px;margin-bottom:8px;cursor:pointer;transition:.15s;font-size:11.5px;line-height:1.6}
.node:hover{border-color:var(--teal);transform:translateX(2px)}
.node.on{border-color:var(--red);background:var(--red-l)}
.node .nt{display:flex;align-items:center;gap:5px;font-weight:600;margin-bottom:2px;font-size:11.5px}
.node .nd{font-size:10px;color:var(--ink3);line-height:1.6}
.mk{width:6px;height:6px;border-radius:2px;flex:0 0 6px}
.detail{min-height:130px}
.smile{width:100%;height:170px}

/* ---------- embodied intelligence demo ---------- */
.emb-sub{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:0 0 18px;padding:8px 10px;background:var(--paper2);border:1px solid var(--line);border-radius:9px}
.emb-sub button{padding:6px 12px;border-radius:6px;font-size:11.5px;color:var(--ink2);white-space:nowrap;transition:.15s}
.emb-sub button:hover{background:var(--paper3);color:var(--ink)}
.emb-sub button.on{background:var(--ink);color:#fff;font-weight:600}
.emb-sub .sub-lbl{font-size:10px;color:var(--ink3);letter-spacing:1.4px;padding:0 8px 0 4px}
.path-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.path-card{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;background:var(--paper);padding:13px 14px;cursor:pointer;transition:.16s;min-width:0;text-align:left}
.path-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.path-card.on{background:var(--paper2);border-color:var(--c);border-top-color:var(--c);box-shadow:0 4px 16px rgba(40,38,30,.08)}
.path-card .pn{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--c)}
.path-card .pq{font-size:11px;color:var(--ink2);line-height:1.65;margin-top:6px}
.path-card .pc{font-size:10px;color:var(--ink3);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.formula{font-family:Georgia,serif;font-size:12.5px;background:var(--paper3);border-radius:6px;padding:8px 12px;color:var(--ink);letter-spacing:.4px;overflow-x:auto;white-space:nowrap}
.looprow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.loop-c{border:1px solid var(--line);border-radius:9px;background:var(--paper2);padding:11px 12px}
.loop-c b{font-family:var(--serif);font-size:12.5px;display:block}
.loop-c .lt{font-size:10.5px;color:var(--ink2);margin-top:5px;line-height:1.6}
.loop-c .lm{font-size:10px;color:var(--red);margin-top:7px;border-top:1px dashed var(--line);padding-top:6px;line-height:1.6}
.layer-row{display:flex;align-items:stretch;border:1px solid var(--line);border-bottom:none;background:var(--paper)}

  tab:'overview', scale:'ouhai', phase:100, active:'S2',
  weights:{}, notes:{}, custom:[], gaps:{}, filter:'all',
  indTab:'embodied', embTab:'paths', embPath:'VLA', indNode:null, indDetailFixed:null
});
let state = defState();
try{
  const raw = localStorage.getItem(KEY);
  if(raw){ const p=JSON.parse(raw); state=Object.assign(defState(),p);
    // 旧版本存档没有具身智能视角：一次性迁移到新 demo，之后尊重用户选择
    if(!('embTab' in p)){ state.indTab='embodied'; state.embTab='paths'; state.embPath='VLA'; }
  }
}catch(e){}
const save = () => { try{ localStorage.setItem(KEY,JSON.stringify(state)); const s=document.getElementById('saveState'); if(s){s.textContent='已自动保存'; clearTimeout(window.__st); window.__st=setTimeout(()=>{s.textContent='本地已就绪';},1400);} }catch(e){} };
const allFactors = () => SEED.concat(state.custom||[]);
const cfg = id => state.weights[id] || (state.weights[id] = {cert:(SEED.find(f=>f.id===id)||{cert:50}).cert, w:(SEED.find(f=>f.id===id)||{w:70}).w, enabled:true, note:''});
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pct = n => Math.round(n*100)+'%';

/* ---------- 核心计算：灰度赋权 → 两主轴 → softmax 情景概率 ---------- */
function compute(){
  let nI=0,nE=0,den=0,cert=0,cnt=0;
  allFactors().forEach(f=>{
    const s=cfg(f.id); if(!s.enabled) return;
    const g=(s.w/100)*(0.25+0.75*(s.cert/100)); // 灰度：不确定因子降权但不丢弃
    nI+=g*f.li; nE+=g*f.le; den+=g; cert+=s.cert/100; cnt++;
  });
  const I=den?nI/den:0, E=den?nE/den:0;
  const raw=SCEN.map(s=>Math.exp(1.45*(s.I*I+s.E*E)+s.prior));
  const sum=raw.reduce((a,b)=>a+b,0);
  const probs=raw.map(r=>r/sum);
  const H=-probs.reduce((a,p)=>a+(p>0?p*Math.log(p):0),0)/Math.log(4);
  return {I,E,probs,entropy:H,avgCert:cnt?cert/cnt:0,cnt};
}
const probOf = id => compute().probs[SCEN.findIndex(s=>s.id===id)];

}

}

function updateMetrics(){
  const m=compute();
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  set('mCnt',m.cnt); set('mCert',Math.round(m.avgCert*100)+'%');
  set('mI',(m.I>=0?'+':'')+m.I.toFixed(2)); set('mE',(m.E>=0?'+':'')+m.E.toFixed(2));
  set('mH',Math.round(m.entropy*100)+'%');
  const b=document.getElementById('barH'); if(b)b.style.width=(m.entropy*100).toFixed(0)+'%';
}

function scenarioSVG(m){
  const cx=210,cy=210,R=158;
  const x=cx+(m.E/2)*R, y=cy-(m.I/2)*R;
  const q=[
   {i:0,x:cx,y:cy-R/2,w:R,h:R/2,c:'#AE3E2C'},
   {i:1,x:cx,y:cy,w:R,h:R/2,c:'#3C5A80'},
   {i:3,x:cx-R,y:cy-R/2,w:R,h:R/2,c:'#2C6C67'},
   {i:2,x:cx-R,y:cy,w:R,h:R/2,c:'#6A5680'}];
  return '<svg viewBox="0 0 420 420" style="width:100%;height:auto;display:block">'+
   q.map(o=>'<rect x="'+o.x+'" y="'+o.y+'" width="'+o.w+'" height="'+o.h+'" fill="'+o.c+'" opacity="'+(0.10+m.probs[o.i]*1.35).toFixed(2)+'"/>').join('')+
   '<rect x="52" y="52" width="316" height="316" fill="none" stroke="#E4E0D6"/>'+
   '<line x1="210" y1="52" x2="210" y2="368" stroke="#C9C3B5" stroke-dasharray="4 4"/>'+
   '<line x1="52" y1="210" x2="368" y2="210" stroke="#C9C3B5" stroke-dasharray="4 4"/>'+
   '<text x="216" y="68" font-size="10" fill="#8B928B">内部动能 强 ↑</text>'+
   '<text x="216" y="360" font-size="10" fill="#8B928B">内部动能 弱 ↓</text>'+
   '<text x="286" y="204" font-size="10" fill="#8B928B">外部开放 →</text>'+
   '<text x="58" y="204" font-size="10" fill="#8B928B">← 外部割裂</text>'+
   // quadrant labels
   [['S1',320,105,'#AE3E2C'],['S2',320,300,'#3C5A80'],['S3',100,300,'#6A5680'],['S4',100,105,'#2C6C67']].map(a=>{
     const idx=SCEN.findIndex(s=>s.id===a[0]);
     return '<text x="'+a[1]+'" y="'+a[2]+'" text-anchor="middle" font-size="12" font-family="Georgia" fill="'+a[3]+'">'+a[0]+' '+SCEN[idx].n+'</text>'+
      '<text x="'+a[1]+'" y="'+(a[2]+20)+'" text-anchor="middle" font-size="17" font-family="Georgia" fill="'+a[3]+'">'+pct(m.probs[idx])+'</text>';
   }).join('')+
   '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="13" fill="rgba(255,255,255,.75)" stroke="#232823" stroke-width="1.5"/>'+
   '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5" fill="#232823"/>'+
   '<text x="'+(x+18).toFixed(1)+'" y="'+(y-10).toFixed(1)+'" font-size="10" fill="#232823">当前合成位置</text>'+
   '</svg>';
}

    <div class="divider"></div>
    <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"><button class="btn sm" data-tab="factors">去因子库调整确定性 / 权重 →</button><span class="small muted">改动滑块后，「总览」与「情景推演」的四个世界概率会实时重算：这就是「从宏观到微观、再自下而上验证」的闭环。</span></div>

}

   {n:'05',t:'灰度赋权',d:'g = w × (0.25 + 0.75c)。不确定的因子降权但保留；对尾部事件只做压力测试，不做点预测。',c:'gold'},
   {n:'06',t:'情景回推与更新',d:'softmax 得相对概率 → 为每个情景写信号与动作 → 季度用新证据做贝叶斯式更新，并记录反例。',c:'red'}];
  document.getElementById('v-method').innerHTML=`
  <div class="hero" style="padding:22px 28px"><div class="hero-tag">METHOD</div><h1 style="font-size:24px">像做因子回归一样思考未来</h1><p>用户说得像，也确实像：挖因子 → 看相关性 → 去共线性 → 降维 → 赋权 → 灰度预测回可能性。区别在于，社会系统没有稳定的样本分布，所以这里的输出是<b>结构化的置信度</b>，不是可复现的点估计。</p></div>
  <div class="card">
    <h3>推演流水线</h3>
    <div class="grid" style="grid-template-columns:repeat(6,1fr);gap:9px;margin-top:14px">
      ${steps.map(s=>'<div style="border-top:2px solid var(--'+s.c+');padding-top:9px"><div style="font-family:Georgia,serif;font-size:19px;color:var(--'+s.c+')">'+s.n+'</div><div style="font-size:12px;font-weight:600;margin:4px 0">'+s.t+'</div><div class="tiny" style="line-height:1.75">'+s.d+'</div></div>').join('')}
    </div>
  </div>
  <div class="grid g2" style="margin-top:16px;align-items:start">
    <div class="card">
      <h3>数学约定（刻意保持简单，便于被推翻）</h3>
      <div class="note-box" style="font-family:Georgia,serif;font-size:12.5px;line-height:2.1;margin-top:10px">
       gᵢ = wᵢ × (0.25 + 0.75·cᵢ)<br>
       I = Σ gᵢ·liᵢ / Σ gᵢ &nbsp;,&nbsp; E = Σ gᵢ·leᵢ / Σ gᵢ<br>
       P(Sₖ) = exp(1.45·(aₖ·I + bₖ·E) + priorₖ) / Σⱼ exp(…)<br>
       H = −Σ P·ln P / ln 4
      </div>
      <ul class="dot" style="margin-top:12px">
        <li><b>cᵢ</b>＝确定性灰度，5%–100%；<b>wᵢ</b>＝你认为这个因子的重要性。</li>
        <li><b>li / le</b>＝该因子对两条主轴的载荷，取值 −2…+2，是本框架最需要实证校准的参数。</li>

        <li><b>1.45</b>＝分辨系数，越大概率越集中；<b>prior</b>＝给基准情景的温和先验，防止模型过度自信。</li>
        <li><b>H</b>＝归一化熵，衡量四个未来有多难分高下；H 高时，应提高可逆性而非提高预测精度。</li>

        <li><b>载荷与相关系数是占位值。</b>目前来自理论判断与公开资料，必须用历史序列回测、用企业访谈修正。</li>

function wbCard(title, sub, rows){
  return `<div class="card"><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}${rows}</div>`;
}
function wbTable(head, body){
  return `<table class="tbl"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
}
function fmtPct(v,d=2){ return v==null?'—':(v*100).toFixed(d)+'%'; }

function renderDeep(){

  let h='';

      <div class="lead">${(C.meta||{}).note||''}　·　${(C.meta||{}).date||''}</div>`;
  (C.sections||[]).forEach(sec=>{
    const pts=(sec.key_points||[]).map(x=>`<li>${x}</li>`).join('');
    let body='<ul style="margin:6px 0 0 18px;font-size:12.5px;line-height:2;color:#4a4a44">'+pts+'</ul>';
    if(sec.policy_face){
      const pf=sec.policy_face;
      body+=wbTable(['维度','权重'], Object.entries(pf.weights).map(([k,v])=>`<tr><td>${k}</td><td>${v}%</td></tr>`).join(''));
      body+=wbTable(['媒体','框架映射'], Object.entries(pf.media_mapping).map(([k,v])=>`<tr><td><b>${k}</b></td><td class="dim">${v}</td></tr>`).join(''));
      body+=`<p class="note">${pf.note}</p>`;
    }
    if(sec.judgments){
      body+=wbTable(['判断','置信度','失效条件'], sec.judgments.map(j=>{

  });
  document.getElementById('v-deep').innerHTML=h;

function renderForecast(){
  const F = window.__FORECAST__ || {};
  let h='';
  h+=`<div class="h1">基于分析的预测</div>
      <div class="lead">${F.principle||''}　·　数据时点 ${F.as_of||''}</div>`;
  const rows=(F.forecasts||[]).map(f=>{
    const conf=f.confidence||0;
    const col = conf>=75?'#0a7a52':(conf>=55?'#c98a00':'#8a8578');
    const bar = '<span style="display:inline-block;width:60px;height:4px;background:#eee9df;border-radius:2px;vertical-align:middle;margin-right:6px">'
              + `<i style="display:block;height:100%;width:${conf}%;background:${col};border-radius:2px"></i></span>`;
    return `<tr>
      <td><b>${f.id}</b></td>
      <td>${bar}<span style="color:${col};font-variant-numeric:tabular-nums">${conf}%</span></td>
      <td>${f.horizon}</td>
      <td><b>${f.claim}</b><div class="dim" style="margin-top:4px">依据：${f.basis}</div>
          ${f.fails_if&&f.fails_if!=='—'?`<div class="dim" style="color:#c0392b">失效条件：${f.fails_if}</div>`:''}
          <div class="dim" style="color:#0a7a52">行动：${f.action}</div></td>
    </tr>`;
  }).join('');
  h+=wbCard('八条判断', '置信度是主观分级，不是统计频率',
    wbTable(['#','置信度','期限','判断'], rows));
  if((F.antiforecasts||[]).length){
    h+=wbCard('明确不预测的事项', '这一节和上面同样重要',
      '<ul style="margin:6px 0 0 18px;font-size:12.5px;line-height:2;color:#6b675c">'
      + F.antiforecasts.map(x=>`<li>${x}</li>`).join('') + '</ul>');
  }
  document.getElementById('v-forecast').innerHTML=h;
}

function wbCard(title, sub, rows){
  return `<div class="card"><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}${rows}</div>`;
}
function wbTable(head, body){
  return `<table class="tbl"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
}
function fmtPct(v,d=2){ return v==null?'—':(v*100).toFixed(d)+'%'; }

function renderQuant(){
  const q=WB.quant||{}, t=WB.tests||{};
  const v4=q.v4||{}, lo=q.long_only||{}, sv=q.survivorship||{}, cap=q.capacity||[], cb=q.combo||{}, cta=q.cta||{};
  const ms=t.macro_feature||{};
  let h='';
  h+=`<div class="h1">量化实证</div>
      <div class="lead">这一页的全部数字来自本仓跑批，可追溯到 reports/data/ 下对应文件。所有区间标注样本长度。</div>`;

  // 核心指标
  const survAdj = (cap[0]||{}).ann_excess_surv_adj;
  h+=wbCard('核心结论', '股票策略 v4，1 亿规模、top60、5 日调仓', `
    <div class="kpis">
      <div class="kpi"><span>样本外 RankIC</span><b>${(v4.test_ic||0).toFixed(4)}</b><i>105 期 / 2.1 年</i></div>
      <div class="kpi"><span>校准误差 ECE</span><b>${(v4.ece||0).toFixed(4)}</b><i>越低越好</i></div>
      <div class="kpi"><span>年化超额</span><b class="pos">${fmtPct((cap[0]||{}).ann_excess)}</b><i>含冲击成本</i></div>
      <div class="kpi"><span>含幸存者修正</span><b class="pos">${fmtPct(survAdj)}</b><i>唯一对外口径</i></div>
      <div class="kpi"><span>IR</span><b>1.1–1.3</b><i>成本假设敏感</i></div>
      <div class="kpi"><span>容量上限</span><b>1–2 亿</b><i>超过超额归零</i></div>
    </div>`);

  // 容量曲线
  const capRows = cap.map(r=>`<tr>
      <td>${r.size_yi} 亿</td><td>${r.cap?r.cap*100+'%':'不限'}</td>
      <td>${r.fill==null?'—':(r.fill*100).toFixed(1)+'%'}</td>
      <td>${fmtPct(r.ann_excess)}</td>
      <td style="color:${(r.ann_excess_surv_adj||0)>0?'#0a7':'#c33'}">${fmtPct(r.ann_excess_surv_adj)}</td>
      <td>${r.ir==null?'—':r.ir.toFixed(2)}</td></tr>`).join('');
  h+=wbCard('容量曲线', '规模 × 限速 → 超额。限速会拖慢建仓，损失远大于省下的冲击成本', 
            wbTable(['规模','限速','建仓完成率','超额','幸存者修正','IR'], capRows));

  // 幸存者偏差
  const sens=(sv.sensitivity||[]).map(x=>`<tr><td>${fmtPct(x['缺失股年化'],0)}</td><td style="color:#c33">+${x['组合年化高估(pp)']} pp</td></tr>`).join('');
  h+=wbCard('幸存者偏差', `深沪 2012 年以来退市 ${sv.delisted_since_2012} 只，面板覆盖 ${sv.panel_covers_delisted} 只`,
    wbTable(['假设退市股年化','组合超额高估'], sens)+
    `<p class="note">占全市场 ${fmtPct(sv.missing_share)}。这是所有数字都要打折的原因。</p>`);

  // CTA
  const ctaRows=Object.entries(cta).map(([k,v])=>`<tr>
      <td>${v.label||k}</td><td>${fmtPct(v.ann)}</td><td>${v.sharpe==null?'—':v.sharpe.toFixed(2)}</td>
      <td>${fmtPct(v.max_dd)}</td><td>${v.start||''} ~ ${v.end||''}</td></tr>`).join('');
  h+=wbCard('CTA 趋势策略', '21 年样本，含随机信号对照 —— 这是全项目可信度最高的结论',
    wbTable(['策略','年化','Sharpe','最大回撤','样本'], ctaRows));

  // 组合
  const comboRows=Object.entries(cb).filter(([k,v])=>v&&v.label).map(([k,v])=>`<tr>
      <td>${v.label}</td><td>${fmtPct(v.ann)}</td><td>${v.sharpe==null?'—':v.sharpe.toFixed(2)}</td>
      <td>${fmtPct(v.max_dd)}</td></tr>`).join('');
  h+=wbCard('股票 × CTA 组合', `相关性 ${(cb.corr||0).toFixed(3)}（低）—— 组合后回撤显著下降`,
    wbTable(['组合','年化','Sharpe','最大回撤'], comboRows));

  // 宏观当特征
  if(ms.macro_6m){
    h+=wbCard('宏观当特征 vs 当规则', '同一批宏观数据，用法决定成败',
      wbTable(['用法','IC','ICIR','胜率'], `
        <tr><td>量价 + 宏观（6 月滚动窗）</td><td class="pos">${ms.macro_6m.ic_mean.toFixed(4)}</td><td>${ms.macro_6m.icir.toFixed(3)}</td><td>${fmtPct(ms.macro_6m.ic_win)}</td></tr>
        <tr><td>纯量价（同窗口）</td><td>${ms.price_only_6m.ic_mean.toFixed(4)}</td><td>${ms.price_only_6m.icir.toFixed(3)}</td><td>${fmtPct(ms.price_only_6m.ic_win)}</td></tr>`)+
      `<p class="note">做规则（调仓位/过滤）实测为负；做特征为正。</p>`);
  }

  // 六个证伪
  const falsified=[
    ['美林时钟能择时','超额 +2.53% → −1.94%，IR 1.18 → −0.58'],
    ['时钟做过滤器有效','换参数即失效，改善集中在单一年份 → 过拟合'],
    ['对冲能降低回撤','对冲后 3.3% vs 不 hedge 7.72%，回撤几乎不变'],
    ['打板/抓龙头可行','涨停 70,003 次，可成交率仅 26%，期望 +0.13%~0.20% 低于成本'],
    ['拉长持有期能提容量','换手 0.69 → 0.95 反而上升，超额同时下降'],
    ['产业分析叠加量化能提升','重叠率 0.5%（34/6300），IR 1.91 → 1.88'],
  ];
  h+=wbCard('六个被我们自己证伪的假设', '这一节比正面结论更重要',
    wbTable(['曾相信','实测'], falsified.map(([a,b])=>`<tr><td>${a}</td><td class="neg">${b}</td></tr>`).join('')));

  document.getElementById('v-quant').innerHTML=h;
}

function wbCard(title, sub, rows){
  return `<div class="card"><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}${rows}</div>`;
}
function wbTable(head, body){
  return `<table class="tbl"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
}
function fmtPct(v,d=2){ return v==null?'—':(v*100).toFixed(d)+'%'; }

function renderQuant(){

  h+=wbCard('核心结论', '股票策略 v4，1 亿规模、top60、5 日调仓', `
    <div class="kpis">
      <div class="kpi"><span>样本外 RankIC</span><b>${(v4.test_ic||0).toFixed(4)}</b><i>105 期 / 2.1 年</i></div>

      <div class="kpi"><span>IR</span><b>1.1–1.3</b><i>成本假设敏感</i></div>
      <div class="kpi"><span>容量上限</span><b>1–2 亿</b><i>超过超额归零</i></div>
    </div>`);

  // 容量曲线
  const capRows = cap.map(r=>`<tr>
      <td>${r.size_yi} 亿</td><td>${r.cap?r.cap*100+'%':'不限'}</td>

      <td>${r.ir==null?'—':r.ir.toFixed(2)}</td></tr>`).join('');
  h+=wbCard('容量曲线', '规模 × 限速 → 超额。限速会拖慢建仓，损失远大于省下的冲击成本', 
            wbTable(['规模','限速','建仓完成率','超额','幸存者修正','IR'], capRows));

  // 幸存者偏差
  const sens=(sv.sensitivity||[]).map(x=>`<tr><td>${fmtPct(x['缺失股年化'],0)}</td><td style="color:#c33">+${x['组合年化高估(pp)']} pp</td></tr>`).join('');
  h+=wbCard('幸存者偏差', `深沪 2012 年以来退市 ${sv.delisted_since_2012} 只，面板覆盖 ${sv.panel_covers_delisted} 只`,

    `<p class="note">占全市场 ${fmtPct(sv.missing_share)}。这是所有数字都要打折的原因。</p>`);

  // CTA
  const ctaRows=Object.entries(cta).map(([k,v])=>`<tr>

      <td>${fmtPct(v.max_dd)}</td><td>${v.start||''} ~ ${v.end||''}</td></tr>`).join('');
  h+=wbCard('CTA 趋势策略', '21 年样本，含随机信号对照 —— 这是全项目可信度最高的结论',
    wbTable(['策略','年化','Sharpe','最大回撤','样本'], ctaRows));

  // 组合
  const comboRows=Object.entries(cb).filter(([k,v])=>v&&v.label).map(([k,v])=>`<tr>

    wbTable(['组合','年化','Sharpe','最大回撤'], comboRows));

  // 宏观当特征
  if(ms.macro_6m){

      wbTable(['用法','IC','ICIR','胜率'], `

        <tr><td>纯量价（同窗口）</td><td>${ms.price_only_6m.ic_mean.toFixed(4)}</td><td>${ms.price_only_6m.icir.toFixed(3)}</td><td>${fmtPct(ms.price_only_6m.ic_win)}</td></tr>`)+
      `<p class="note">做规则（调仓位/过滤）实测为负；做特征为正。</p>`);
  }

  // 六个证伪
  const falsified=[
    ['美林时钟能择时','超额 +2.53% → −1.94%，IR 1.18 → −0.58'],
    ['时钟做过滤器有效','换参数即失效，改善集中在单一年份 → 过拟合'],
    ['对冲能降低回撤','对冲后 3.3% vs 不 hedge 7.72%，回撤几乎不变'],
    ['打板/抓龙头可行','涨停 70,003 次，可成交率仅 26%，期望 +0.13%~0.20% 低于成本'],
    ['拉长持有期能提容量','换手 0.69 → 0.95 反而上升，超额同时下降'],
    ['产业分析叠加量化能提升','重叠率 0.5%（34/6300），IR 1.91 → 1.88'],
  ];
  h+=wbCard('六个被我们自己证伪的假设', '这一节比正面结论更重要',
    wbTable(['曾相信','实测'], falsified.map(([a,b])=>`<tr><td>${a}</td><td class="neg">${b}</td></tr>`).join('')));

  document.getElementById('v-quant').innerHTML=h;
}

function renderChain(){
  const c=WB.industry||{}, t=WB.tests||{};
  let h='';
  h+=`<div class="h1">产业传导</div>
      <div class="lead">供应链图 ${c.graph_stats.total_edges} 条关系，其中 ${c.graph_stats.with_share} 条已核定份额。瓶颈由产业事实判定，不由公式推算。</div>`;

  // 瓶颈
  const bnRows=Object.entries(c.bottlenecks||{}).map(([seg,info])=>{
    return info.bottlenecks.map(b=>`<tr>
      <td>${seg}</td><td>${'★'.repeat(b.severity)}</td><td>${b.type}</td>
      <td><b>${b.node}</b></td><td class="dim">${b.fact}</td></tr>`).join('');
  }).join('');
  h+=wbCard('产业瓶颈清单', '★=严重度，每条都带事实依据',
    wbTable(['环节','严重度','类型','卡点','依据'], bnRows));

  // 冲击场景
  const impRows=Object.entries(c.impacts||{}).map(([name,sc])=>{
    const top=Object.entries(sc.impact||{}).slice(0,4).map(([k,v])=>
      `<span style="color:${v<0?'#c33':'#0a7'}">${k} ${v>0?'+':''}${v.toFixed(2)}</span>`).join('、');
    return `<tr><td><b>${name}</b><br><span class="dim">${sc.logic}</span></td>
      <td>${sc.mode_cn}</td><td>${sc.polarity==='neg'?'<span class="neg">负面</span>':'<span class="pos">正面</span>'}</td>
      <td>${top}</td></tr>`;
  }).join('');
  h+=wbCard('九个冲击场景', '短缺累积（越往下越缺）vs 成本衰减（逐级消化）vs 需求拉动（上游分享）',
    wbTable(['场景','机制','方向','受影响'], impRows));

  // 三条验证
  const es=t.event_signal||{}, lt=t.leadtime||{}, inf=t.industry_filter||{};
  const esRows = es.A_追高T1买超额 ? `
    <tr><td>追事件（T+1 买入）</td><td class="neg">${fmtPct(es.A_追高T1买超额.mean)}</td><td>${(es.A_追高T1买超额.t||0).toFixed(1)}</td><td>${es.A_追高T1买超额.n}</td></tr>
    <tr><td>不追（T 日持有）</td><td class="neg">${fmtPct(es.B_持有T5超额.mean)}</td><td>${(es.B_持有T5超额.t||0).toFixed(1)}</td><td>${es.B_持有T5超额.n}</td></tr>` : '';
  h+=wbCard('三条验证（全部为负）', '产业框架不能产生 alpha，这是实测结论',
    wbTable(['尝试','结果','t 值','样本'], `
      <tr><td>预测传导时滞（Lead-lag）</td><td class="neg">三对全部 0 天，无可测时滞</td><td>—</td><td>899 天/对</td></tr>
      ${esRows}
      <tr><td>叠加到量化模型</td><td class="neg">重叠 ${(inf.coverage?.hits||0)}/${(inf.coverage?.total||0)}（${((inf.coverage?.hits||0)/(inf.coverage?.total||1)*100).toFixed(1)}%），IR 1.91→1.88</td><td>—</td><td>105 期</td></tr>`));

  h+=wbCard('结论：产业框架的边界', '', `
    <table class="tbl"><tbody>
    <tr><td>预测谁先涨</td><td class="neg">✗ 无时滞可测</td></tr>
    <tr><td>事件后追涨</td><td class="neg">✗ 显著亏损</td></tr>
    <tr><td>叠加到量化选股</td><td class="neg">✗ 重叠 0.5%</td></tr>
    <tr><td><b>判断定价是否过度</b></td><td class="pos">✓ 涨幅越极端，回归越强</td></tr>
    <tr><td><b>持仓风险预警</b></td><td class="pos">✓ 关键节点出事时知道谁受影响</td></tr>
    <tr><td><b>产业认知框架</b></td><td class="pos">✓ 对一级市场更有价值</td></tr>
    </tbody></table>`);

  document.getElementById('v-chain').innerHTML=h;
}

function renderAll(){ renderNav(); Object.keys(RENDER).forEach(k=>RENDER[k]()); }
function renderCurrent(){ renderNav(); RENDER[state.tab](); }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-scale],[data-act],[data-filter],[data-sc],[data-ind],[data-emb],[data-embpath],[data-node],[data-del]');
  if(!t) return;
  if(t.dataset.tab){ state.tab=t.dataset.tab; renderCurrent(); document.getElementById('scroll').scrollTop=0; save(); }
  else if(t.dataset.scale){ state.scale=t.dataset.scale; renderCurrent(); save(); }
  else if(t.dataset.filter){ state.filter=t.dataset.filter; RENDER.factors(); save(); }
  else if(t.dataset.sc){ state.active=t.dataset.sc; RENDER.scenario(); save(); }
  else if(t.dataset.ind){ state.indTab=t.dataset.ind; state.indNode=null; RENDER.industry(); save(); }
  else if(t.dataset.emb){ state.embTab=t.dataset.emb; RENDER.industry(); save(); }
  else if(t.dataset.embpath){ state.embPath=t.dataset.embpath; RENDER.industry(); save(); }
  else if(t.dataset.node){ state.indNode=t.dataset.node; RENDER.industry(); save(); }
  else if(t.dataset.del){ state.custom=state.custom.filter(f=>f.id!==t.dataset.del); delete state.weights[t.dataset.del]; RENDER.factors(); save(); }
  else if(t.dataset.act){
    const a=t.dataset.act;
    if(a==='export'){
      const out={meta:{name:'势·数 趋势推演工作台',exported:new Date().toISOString(),version:1},state:state,seedFactors:SEED};
      const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
      const u=URL.createObjectURL(blob),link=document.createElement('a');
      link.href=u; link.download='趋势推演工作台_'+new Date().toISOString().slice(0,10)+'.json'; link.click(); URL.revokeObjectURL(u);
    } else if(a==='import'){ document.getElementById('fileIn').click(); }
    else if(a==='reset'){ if(confirm('重置会清空你在本地填写的所有备注、自定义因子与滑块调整，确定继续？')){ localStorage.removeItem(KEY); state=defState(); renderAll(); } }
    else if(a==='print'){ window.print(); }
    else if(a==='addFactor'){
      const name=document.getElementById('nfName').value.trim();
      if(!name){ alert('请先填写因子名称'); return; }
      const cat=document.getElementById('nfCat').value, d=parseInt(document.getElementById('nfDir').value,10);
      const id='u_'+Date.now();
      state.custom.push({id:id,cat:cat,name:name,dir:d>0?'+':d<0?'−':'±',hz:'自定义',cert:50,w:60,li:d,le:d,
        desc:'用户自定义因子。请补充定义、观测口径与理论依据。',sig:['待补充观测指标'],law:'待补充'});
      state.weights[id]={cert:50,w:60,enabled:true,note:''};
      state.filter='all'; RENDER.factors(); RENDER.overview(); RENDER.scenario(); save();
    }
  }
});

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.range==='phase'){ state.phase=parseInt(el.value,10); RENDER.clock(); save(); }
  else if(el.dataset.range==='cert'||el.dataset.range==='w'){
    const s=cfg(el.dataset.id); s[el.dataset.range==='cert'?'cert':'w']=parseInt(el.value,10);
    const lab=el.parentNode.querySelector('label b'); if(lab)lab.textContent=el.value+'%';
    updateMetrics(); RENDER.scenario(); RENDER.overview(); save();
  }
  else if(el.dataset.note){ state.notes[el.dataset.note]=el.value; save(); }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.ck){ cfg(el.dataset.ck).enabled=el.checked; RENDER.factors(); RENDER.scenario(); RENDER.overview(); save(); }
  else if(el.dataset.gap){ state.gaps[el.dataset.gap]=el.checked; RENDER.gaps(); save(); }
});
document.getElementById('fileIn').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ const p=JSON.parse(r.result); if(p.state){ state=Object.assign(defState(),p.state); renderAll(); save(); alert('导入成功'); } else alert('文件格式不正确'); }catch(err){ alert('解析失败：'+err.message); } };
  r.readAsText(f); e.target.value='';
});

renderAll();
